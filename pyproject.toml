[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-ai-studio"
version = "0.1.0"
description = "Estudio vocal con IA: practica canto, analiza y modifica tu voz (procesamiento local)."
authors = [{ name = "MDCL", email = "76896366+Skaiiner@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "imageio-ffmpeg>=0.5",
    "psutil>=5.9",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
vocal-ai-studio = "vocal_ai_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
